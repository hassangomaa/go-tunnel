# /etc/nginx/sites-available/go.tejarahlntpoor.com
# Board paths → inspect UI. All other paths → tunnel relay (port 4055).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go.tejarahlntpoor.com;

    ssl_certificate /etc/letsencrypt/live/go.tejarahlntpoor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.tejarahlntpoor.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10M;

    location = / { proxy_pass http://127.0.0.1:4055; include /etc/nginx/proxy_params_go_board; }
    location ~ ^/(board|dashboard|inspect)/?$ { proxy_pass http://127.0.0.1:4055; include /etc/nginx/proxy_params_go_board; }
    location /api/ { proxy_pass http://127.0.0.1:4055; include /etc/nginx/proxy_params_go_board; }
    location /ws { proxy_pass http://127.0.0.1:4055; include /etc/nginx/proxy_params_go_ws; }
    location / { proxy_pass http://127.0.0.1:4055; include /etc/nginx/proxy_params_go_ws; }
}

server {
    listen 80;
    listen [::]:80;
    server_name go.tejarahlntpoor.com;
    return 301 https://go.tejarahlntpoor.com$request_uri;
}
